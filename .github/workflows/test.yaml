name: test

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash  # with pipefail, so a failure piped into tee still fails the step

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # OCaml 4.14 and dune 3 from the distribution; hw_diff runs the RTL in Icarus.
      - name: Install OCaml, dune and Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml ocaml-dune iverilog

      - name: Build
        run: dune build 2>&1 | tee build.log

      # semantics (test_spike), projections (fuzz), RTL vs reference model (hw_diff)
      - name: Test
        run: dune test --force 2>&1 | tee test.log

      # the Tiny Tapeout cocotb vectors, as tapeout/export_tt_repo.sh makes them
      - name: Generate the gate-level test vectors
        run: |
          mkdir -p tt_vectors
          dune exec ./tools/gen_tt_test.exe tt_vectors
          rm -f tt_vectors/cfg.hex tt_vectors/usb_token/cfg.hex
          find tt_vectors -type f | sort

      - name: Upload test vectors
        uses: actions/upload-artifact@v7
        with:
          name: tt-vectors
          path: tt_vectors

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            build.log
            test.log
